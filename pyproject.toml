[tool.ruff]
line-length = 100
extend-exclude = ["lab04-ai-coding-ux", "pricing_legacy.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["lab04-ai-coding-ux"]

[tool.coverage.run]
omit = [
    "lab04-ai-coding-ux/*",
    "tests/*",
    "pricing_legacy.py",
]
